# ============================================================================
# nginx — main config (eval-app, contenedor nginx:1.27-alpine)
#
# Defaults prudentes para una app Next.js con uploads grandes (hojas OMR
# escaneadas) y streaming de PDFs (cuadernillos generados server-side).
# ============================================================================

user                 nginx;
worker_processes     auto;
worker_rlimit_nofile 65535;
pid                  /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    # ----- Tipos MIME --------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----- Logging -----------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ----- Buffers y timeouts (ajustados para OMR uploads + PDF streaming) ---
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # Uploads: hojas OMR pueden ser JPG/PNG de varias MB → 25 MB.
    client_max_body_size      25m;
    client_body_buffer_size   128k;
    # Generación de PDF puede tardar varios minutos con imposición → timeouts
    # largos. Mismos valores que los vhosts del host (deploy/nginx/*.conf),
    # que se ajustan con el env (NGINX_PROXY_*).
    proxy_connect_timeout     60s;   # NGINX_PROXY_CONNECT_TIMEOUT
    proxy_send_timeout        1200s; # NGINX_PROXY_SEND_TIMEOUT
    proxy_read_timeout        1200s; # NGINX_PROXY_READ_TIMEOUT
    proxy_buffering            off;     # streaming de PDFs, sin buffering
    proxy_buffer_size         16k;
    proxy_buffers              8 16k;

    # ----- Gzip --------------------------------------------------------------
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # ----- Includes ----------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
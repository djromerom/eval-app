# ============================================================================
# eval-app — server blocks para ecognia.pro
#
# HTTP (80): challenge ACME en /.well-known/acme-challenge/ + redirect 301 al
# HTTPS para todo lo demás. Mantener HSTS incluso aquí para que el navegador
# siempre fuerce HTTPS, incluso si el primer hit es HTTP.
#
# HTTPS (443): reverse proxy a `web:3000` (Next.js standalone) con headers
# de seguridad y cache 1y para assets estáticos.
# ============================================================================

# HTTP ---------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name ecognia.pro www.ecognia.pro;

    # ACME challenge: certbot escribe el token en este dir cuando se renueva
    # vía webroot (la primera emisión usa standalone, pero las renovaciones
    # también pueden caer aquí si configuramos el certbot así en el futuro).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # HSTS precarga — incluso antes de redirigir, le decimos al navegador
    # que SOLO use HTTPS para este host. max-age=300 para no romper una
    # mala config; subir a 31536000 cuando el cert esté estable.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    location / {
        return 301 https://ecognia.pro$request_uri;
    }
}

# HTTPS --------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name ecognia.pro www.ecognia.pro;

    # Certificados emitidos por certbot. Si los archivos no existen, nginx
    # falla al arrancar — eso es deseable, evita servir HTTPS con cert
    # autofirmado.
    ssl_certificate     /etc/letsencrypt/live/ecognia.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecognia.pro/privkey.pem;

    # Protocolos y cifrados modernos (Mozilla "intermediate" +).
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache        shared:SSL:10m;
    ssl_session_timeout      1d;
    ssl_session_tickets      off;

    # ----- Headers de seguridad ----------------------------------------------
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # ----- Assets estáticos: cache largo -------------------------------------
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # `_next/static/` viene con hashes inmutables; cachear 1 año.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- Todo lo demás: proxy a Next ---------------------------------------
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Streaming de PDFs (no buffering — ya viene de proxy_buffering off).
        proxy_redirect off;
    }
}
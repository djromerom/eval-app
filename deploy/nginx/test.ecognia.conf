# ============================================================================
# eval-app STAGING — reverse proxy en nginx del HOST (apt-installed)
#
# Gemelo de ecognia.conf pero apuntando al puerto 3001 (donde escucha el
# web de staging). Certbot emite y gestiona el cert para test.ecognia.pro
# y www.test.ecognia.pro de la misma forma que para prod.
#
# SYNC al VPS (manual):
#   scp deploy/nginx/test.ecognia.conf  root@<vps>:/etc/nginx/sites-enabled/
#   ssh root@<vps> 'nginx -t && systemctl reload nginx'
#
# Diferencias con ecognia.conf:
#   - server_name test.ecognia.pro www.test.ecognia.pro
#   - ssl_certificate apunta a /etc/letsencrypt/live/test.ecognia.pro/...
#   - proxy_pass http://127.0.0.1:3001  (puerto del web de staging)
# ============================================================================

# HTTP → HTTPS (gestionado por certbot, no tocar).
server {
    if ($host = www.test.ecognia.pro) {
        return 301 https://$host$request_uri;
    }
    if ($host = test.ecognia.pro) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name test.ecognia.pro www.test.ecognia.pro;
    return 404;
}

# HTTPS staging.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.ecognia.pro www.test.ecognia.pro;

    # Certbot gestiona estos includes. NO los muevas ni comentes.
    ssl_certificate     /etc/letsencrypt/live/test.ecognia.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.ecognia.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_trusted_certificate /etc/letsencrypt/live/test.ecognia.pro/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # Uploads: hojas OMR pueden ser grandes → 25 MB.
    client_max_body_size 25m;

    # Staging web escucha en 3001 (distinto de prod:3000).
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;

        # Mismos timeouts que prod (PDF puede tardar 30–60s).
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering        off;
        proxy_buffer_size     16k;
        proxy_buffers          8 16k;
    }
}

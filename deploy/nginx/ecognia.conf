# ============================================================================
# eval-app — reverse proxy en nginx del HOST (apt-installed)
#
# Nginx escucha 80 y 443. SSL lo maneja certbot (--nginx plugin), que ya
# instaló los bloques listen 443 + los certificados + HSTS. Este archivo
# REEMPLAZA el default de Debian y deja nginx como reverse proxy hacia
# el contenedor `web:3000` (publicado en 127.0.0.1:3000 del host).
#
# Notas:
# - Mantener los include de Certbot (managed) y los server_name.
# - La sección location / hace proxy_pass al contenedor.
# - El redirect HTTP→HTTPS lo sigue manejando el server block que Certbot
#   añadió (con `if ($host = ecognia.pro) return 301 https://...`).
# ============================================================================

# HTTP → HTTPS (gestionado por certbot, no tocar).
server {
    if ($host = www.ecognia.pro) {
        return 301 https://$host$request_uri;
    }
    if ($host = ecognia.pro) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name ecognia.pro www.ecognia.pro;
    return 404;
}

# HTTPS principal.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecognia.pro www.ecognia.pro;

    # Certbot gestiona estos includes. NO los muevas ni comentes.
    ssl_certificate     /etc/letsencrypt/live/ecognia.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecognia.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_trusted_certificate /etc/letsencrypt/live/ecognia.pro/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # Uploads: hojas OMR pueden ser grandes → 25 MB.
    client_max_body_size 25m;

    # Next.js en Docker expone 3000 al host en 127.0.0.1:3000.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;

        # Timeouts del proxy. Los valores salen del ENV (NGINX_PROXY_*):
        # sincronizalos con deploy/scripts/render-nginx-conf.sh, que además
        # valida que nginx aguante más que la app (PDF_QUEUE_WAIT_MS).
        # Con PDF_QUEUE_WAIT_MS=900000 el nginx necesita > 900 s.
        proxy_connect_timeout 60s;   # NGINX_PROXY_CONNECT_TIMEOUT
        proxy_send_timeout    1200s; # NGINX_PROXY_SEND_TIMEOUT
        proxy_read_timeout    1200s; # NGINX_PROXY_READ_TIMEOUT
        proxy_buffering        off;
        proxy_buffer_size     16k;
        proxy_buffers          8 16k;
    }
}
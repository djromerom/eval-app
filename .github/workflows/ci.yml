name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valores dummy: el build no se conecta a servicios, solo necesita que
      # la validación de env (config/env.ts) pase.
      DATABASE_URL: postgresql://user:pass@localhost:5432/eval
      AUTH_SECRET: dummy-secret-para-ci-solo-build
      QR_SIGNING_SECRET: dummy-qr-secret-para-ci-build
      REDIS_URL: redis://localhost:6379
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm db:generate

      - name: Validar esquema Prisma
        run: pnpm prisma validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitarios
        run: pnpm test

      - name: Build
        run: pnpm build

# =============================================================================
# cd — Continuous Deployment para eval-app en el VPS de ecognia.pro
#
# Flujo:
#   1. trigger: push a `main` (o workflow_dispatch con un SHA opcional)
#   2. build (matriz): construye 2 imágenes en paralelo y las pushea a GHCR,
#      pineadas por `git-<sha>`. El tag `latest` se actualiza también
#      cuando se construye desde `main`.
#   3. deploy: hace SSH al VPS usando la deploy key (`VPS_SSH_KEY`) e
#      invoca `deploy --sha <sha>`. Las imágenes se COMPONEN en el VPS
#      a partir de GHCR_OWNER + GHCR_IMAGE_BASE (en .env.prod) + <sha>.
#
# Secrets requeridos (Settings → Secrets → Actions del repo):
#   VPS_HOST     : IP o dominio del VPS                  (177.7.42.54)
#   VPS_USER     : usuario SSH                            (root)
#   VPS_SSH_KEY  : clave privada ed25519 de deploy        (id_ed25519_eval_deploy)
#
# Requisitos en el VPS:
#   - /opt/eval/bin/cd-wrapper.sh con whitelist `deploy <args>`
#   - /opt/eval/eval-app/.env.prod con: DOMAIN, DATABASE_URL, REDIS_URL,
#     AUTH_SECRET, QR_SIGNING_SECRET, OMR_SERVICE_URL, GHCR_OWNER,
#     GHCR_IMAGE_BASE (default: ghcr.io)
#   - Paquetes GHCR legibles desde el VPS (públicos por default)
# =============================================================================
name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'SHA a desplegar (default: el del evento)'
        required: false
        type: string

# Sólo un deploy a la vez. Si llega otro push mientras corre, espera.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # build — construye y pushea 2 imágenes en paralelo.
  # ---------------------------------------------------------------------------
  build:
    name: build · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image_name: eval-app
            context: .
            # `--file` se resuelve relativo al CWD del runner (raíz del repo),
            # NO al context. Por eso web usa `./Dockerfile` y omr-service usa
            # `./omr-service/Dockerfile` (path desde el CWD, no desde el context).
            dockerfile: ./Dockerfile
          - name: omr-service
            image_name: omr-service
            context: ./omr-service
            dockerfile: ./omr-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=sha,prefix=git-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Sin cache-from/cache-to en el primer run: el cache GHA puede
          # referenciar paths de runs anteriores que no cuadran con el
          # contexto actual (BUILD-LEVEL cache miss → error raro tipo
          # "/prisma: not found"). Una vez que la primera build pasa, las
          # siguientes se cachean automáticamente vía la registry de GHCR
          # (los layers se reusan al hacer `docker buildx build` con la
          # misma imagen base).
          provenance: false
          sbom: false

  # ---------------------------------------------------------------------------
  # deploy — SSH al VPS y corre cd.sh. Solo se pasa --sha (las imágenes
  # se componen en el VPS con .env.prod + ese SHA).
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ecognia.pro
    steps:
      - name: Determine SHA
        id: sha
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            echo "value=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          # `script:` (no `command:`) es el input válido en v1.1.0 — el
          # wrapper SSH del VPS solo acepta el primer token `deploy` y
          # reenvía el resto verbatim a `cd.sh` (`--sha <git-sha>`).
          script: deploy --sha ${{ steps.sha.outputs.value }}

      - name: Smoke-test the deployed site
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' -L https://ecognia.pro/login || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "✔ /login responde 200 (intento $i)"
              exit 0
            fi
            echo "  intento $i/15: código=$CODE, esperando 2s…"
            sleep 2
          done
          echo "✖ /login no respondió 200 después de 30s"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo "- SHA: \`${{ steps.sha.outputs.value }}\`"
            echo "- images composed on the VPS from \`GHCR_OWNER/eval-app:git-<sha>\` and \`omr-service:git-<sha>\`"
          } >> "$GITHUB_STEP_SUMMARY"
